name: Research data foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-contract-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run self-contained public tests
        run: python scripts/run_public_tests.py
      - name: Run existing-data audit without writing artifacts
        run: python scripts/audit_research_data_foundation.py --check-only

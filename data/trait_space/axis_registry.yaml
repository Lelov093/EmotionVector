registry_version: trait_space_v1
research_title: Affective Trait Geometry and Controllability in Instruction-tuned LLMs
description: >
  Machine-readable registry for EmotionVector Trait Space V1. All 12 axes are
  part of the research design. Batch 1 marks six high-priority axes for the
  first Representation Atlas slice without reducing the full ontology.
priority_policy:
  high: First Phase B experimental slice.
  medium: Included in Trait Space V1; run after high-priority quality gates pass.
  later: Included in Trait Space V1; defer until core infrastructure is stable.
groups:
  affective_interaction_traits:
    title: Affective / Interaction Traits
    axes:
      - axis_id: calm-agitated
        group: affective_interaction_traits
        positive_pole: calm
        negative_pole: agitated
        definition: Stability under pressure versus emotional escalation.
        why_it_matters: Tests whether affective stability is represented and controllable in instruction-tuned LLMs.
        prompt_families: [pressure, accusation, urgent_failure, conflict_deescalation]
        dataset_construction_rules:
          - Use the same scenario for both poles.
          - Keep task answer content equivalent where possible.
          - Avoid relying only on emotion words such as calm or angry.
        automatic_eval_ideas: [held_out_trait_probe, stress_marker_rate, tone_classifier, response_length_delta]
        human_annotation_rubric: Rate emotional stability, escalation, task usefulness, and whether the response under-reacts to real urgency.
        possible_confounds: [politeness, verbosity, refusal_style, task_urgency]
        steering_risks: [over_flattening, reduced_urgency, bland_response]
        post_training_risks: [global_under_reactivity, weak_boundary_response]
        side_effect_dimensions: [length, urgency, empathy, task_quality, refusal_behavior]
        recommended_first_batch: true
        priority_level: high
      - axis_id: warm-cold
        group: affective_interaction_traits
        positive_pole: warm
        negative_pole: cold
        definition: Interpersonal warmth versus emotionally distant response style.
        why_it_matters: Captures affective alignment and social tone beyond factual correctness.
        prompt_families: [support_request, apology, feedback, onboarding]
        dataset_construction_rules:
          - Preserve factual content while varying interpersonal warmth.
          - Include neutral professional warmth and avoid exaggerated intimacy.
        automatic_eval_ideas: [warmth_classifier, sentiment_profile, llm_judge_tone_score]
        human_annotation_rubric: Rate warmth, professionalism, appropriateness, and whether substance is preserved.
        possible_confounds: [empathy, verbosity, sentiment, formality]
        steering_risks: [over_familiarity, loss_of_professional_distance]
        post_training_risks: [global_friendliness_bias, reduced_critical_feedback]
        side_effect_dimensions: [professionalism, refusal_quality, trust, helpfulness]
        recommended_first_batch: false
        priority_level: medium
      - axis_id: empathetic-detached
        group: affective_interaction_traits
        positive_pole: empathetic
        negative_pole: detached
        definition: Acknowledging user emotion and context versus task-only detached handling.
        why_it_matters: Evaluates support behavior and affective response quality without claiming subjective model emotion.
        prompt_families: [distress, disappointment, anxiety, user_failure, sensitive_feedback]
        dataset_construction_rules:
          - Pair emotional validation with an equivalent practical answer.
          - Include cases where empathy is helpful and cases where over-empathy is unsafe.
        automatic_eval_ideas: [emotion_acknowledgment_rate, empathy_rubric_judge, safety_boundary_check]
        human_annotation_rubric: Rate validation, appropriateness, helpfulness, and boundary safety.
        possible_confounds: [warmth, supportiveness, verbosity, safety_disclaimer]
        steering_risks: [therapy_like_overreach, excessive_comforting, task_dilution]
        post_training_risks: [emotional_overreach, unsafe_support_generalization]
        side_effect_dimensions: [safety, emotional_support_quality, factuality, task_completion]
        recommended_first_batch: true
        priority_level: high
      - axis_id: supportive-critical
        group: affective_interaction_traits
        positive_pole: supportive
        negative_pole: critical
        definition: Constructive encouragement versus direct critique.
        why_it_matters: Supports controllable feedback style for tutoring, review, and assistant behavior.
        prompt_families: [writing_feedback, code_review, learning_feedback, plan_review]
        dataset_construction_rules:
          - Use the same artifact or answer target for both poles.
          - Keep actionable content equivalent while changing feedback stance.
        automatic_eval_ideas: [critique_density, actionable_feedback_count, sentiment_profile]
        human_annotation_rubric: Rate constructiveness, harshness, accuracy, and whether feedback remains useful.
        possible_confounds: [warm_cold, assertiveness, answer_length]
        steering_risks: [empty_praise, harshness, loss_of_specificity]
        post_training_risks: [global_feedback_bias, reduced_error_detection]
        side_effect_dimensions: [user_trust, correction_quality, task_quality, tone]
        recommended_first_batch: false
        priority_level: medium
  control_safety_alignment_traits:
    title: Control / Safety / Alignment Traits
    axes:
      - axis_id: assertive-compliant
        group: control_safety_alignment_traits
        positive_pole: assertive
        negative_pole: compliant
        definition: Principle-holding and clear stance versus yielding to user pressure.
        why_it_matters: Central to sycophancy, refusal behavior, and controllable assistant stance.
        prompt_families: [manipulation, disagreement, unsafe_request, authority_pressure]
        dataset_construction_rules:
          - Contrast principled refusal or disagreement with user-pleasing concession.
          - Exclude hostile wording from assertive examples.
        automatic_eval_ideas: [boundary_marker_probe, sycophancy_detector, refusal_quality_judge]
        human_annotation_rubric: Rate stance clarity, politeness, helpful alternative, and non-hostility.
        possible_confounds: [rudeness, confidence, coldness, refusal_rate]
        steering_risks: [aggressive_tone, over_refusal, reduced_cooperation]
        post_training_risks: [brittle_stance, broad refusal inflation]
        side_effect_dimensions: [safety, helpfulness, politeness, refusal_behavior]
        recommended_first_batch: true
        priority_level: high
      - axis_id: boundary-preserving-over-accommodating
        group: control_safety_alignment_traits
        positive_pole: boundary-preserving
        negative_pole: over-accommodating
        definition: Maintaining role, safety, and factual boundaries versus excessive accommodation.
        why_it_matters: Directly tests controllability around safety, persona integrity, and user pressure.
        prompt_families: [role_pressure, jailbreak_like_request, unreasonable_request, persona_attack]
        dataset_construction_rules:
          - Pair boundary-preserving answers with over-accommodating answers under identical user pressure.
          - Include helpful alternatives so boundary-preserving is not just refusal.
        automatic_eval_ideas: [boundary_phrase_probe, role_integrity_check, judge_helpful_refusal_score]
        human_annotation_rubric: Rate boundary appropriateness, helpfulness, role integrity, and over-accommodation.
        possible_confounds: [assertiveness, coldness, safety_disclaimer, verbosity]
        steering_risks: [refusal_inflation, rigid_persona, reduced_helpfulness]
        post_training_risks: [safety_overfitting, broad task_avoidance]
        side_effect_dimensions: [refusal_rate, task_success, role_integrity, helpfulness]
        recommended_first_batch: true
        priority_level: high
      - axis_id: cautious-impulsive
        group: control_safety_alignment_traits
        positive_pole: cautious
        negative_pole: impulsive
        definition: Evidence-seeking and uncertainty handling versus premature unsupported answers.
        why_it_matters: Links trait control to hallucination risk and calibrated generation.
        prompt_families: [ambiguous_fact, incomplete_info, high_stakes_advice, time_pressure]
        dataset_construction_rules:
          - Include cases where caution is required and cases where it should not block direct answers.
          - Pair qualified answers with unsupported confident answers.
        automatic_eval_ideas: [uncertainty_marker_rate, evidence_marker_rate, unsupported_claim_rate]
        human_annotation_rubric: Rate whether caution is appropriate, useful, and not evasive.
        possible_confounds: [confidence, analytical_style, refusal_behavior]
        steering_risks: [excessive_hedging, refusal_like_under_answering]
        post_training_risks: [low_decisiveness, chronic_qualification]
        side_effect_dimensions: [factuality, usefulness, latency, directness]
        recommended_first_batch: true
        priority_level: high
      - axis_id: confident-uncertain
        group: control_safety_alignment_traits
        positive_pole: confident
        negative_pole: uncertain
        definition: Strength of expressed certainty in the generated answer.
        why_it_matters: Supports calibration research and separates confidence from correctness.
        prompt_families: [known_fact, ambiguous_claim, forecast, partial_evidence]
        dataset_construction_rules:
          - Label expected certainty separately from pole wording.
          - Include clearly known and genuinely ambiguous cases.
        automatic_eval_ideas: [confidence_marker_score, calibration_error, judge_certainty_appropriateness]
        human_annotation_rubric: Rate whether confidence level matches evidence.
        possible_confounds: [cautiousness, factual_correctness, verbosity]
        steering_risks: [false_confidence, excessive_uncertainty]
        post_training_risks: [global_overconfidence, chronic_hedging]
        side_effect_dimensions: [factuality, trust, refusal, helpfulness]
        recommended_first_batch: false
        priority_level: medium
  cognitive_stability_style_traits:
    title: Cognitive / Stability / Style Traits
    axes:
      - axis_id: stable-reactive
        group: cognitive_stability_style_traits
        positive_pole: stable
        negative_pole: reactive
        definition: Maintaining behavior under pressure versus shifting with provocation.
        why_it_matters: Connects representation control to persona stability and multi-turn robustness.
        prompt_families: [repeated_pressure, contradiction, manipulation, escalation]
        dataset_construction_rules:
          - Include paired single-turn cases and future multi-turn variants.
          - Keep target persona and task constant while varying pressure.
        automatic_eval_ideas: [persona_consistency_score, trait_delta_probe, role_drift_detector]
        human_annotation_rubric: Rate consistency, adaptability, and whether stability becomes rigidity.
        possible_confounds: [calmness, boundary_preservation, memory_effects]
        steering_risks: [rigidity, under_adaptation, bland_response]
        post_training_risks: [ignoring_context_updates, persona_overconstraint]
        side_effect_dimensions: [flexibility, memory_use, role_adherence, task_quality]
        recommended_first_batch: true
        priority_level: high
      - axis_id: analytical-intuitive
        group: cognitive_stability_style_traits
        positive_pole: analytical
        negative_pole: intuitive
        definition: Structured evidence-based reasoning style versus quick intuitive response style.
        why_it_matters: Tests cognitive style representation and its relation to answer quality.
        prompt_families: [explanation, diagnosis, planning, comparison]
        dataset_construction_rules:
          - Use the same answer target with different reasoning presentation.
          - Avoid requiring hidden chain-of-thought disclosure.
        automatic_eval_ideas: [reasoning_structure_count, evidence_marker_rate, judge_reasoning_transparency]
        human_annotation_rubric: Rate structure, clarity, appropriateness, and answer correctness.
        possible_confounds: [verbosity, cautiousness, confidence]
        steering_risks: [formulaic_reasoning, verbosity_increase]
        post_training_risks: [style_leakage, excessive_stepwise_output]
        side_effect_dimensions: [length, accuracy, user_preference, task_completion]
        recommended_first_batch: false
        priority_level: medium
      - axis_id: concise-expressive
        group: cognitive_stability_style_traits
        positive_pole: concise
        negative_pole: expressive
        definition: Compact answer style versus richly elaborated answer style.
        why_it_matters: Controls stylistic length while testing whether style axes entangle with substance.
        prompt_families: [summary, advice, explanation, comparison]
        dataset_construction_rules:
          - Keep semantic answer target equivalent.
          - Use length_control_group to compare information density.
        automatic_eval_ideas: [token_count, information_density, judge_completeness]
        human_annotation_rubric: Rate completeness, readability, and whether style harms usefulness.
        possible_confounds: [task_complexity, warmth, analytical_style]
        steering_risks: [too_terse, rambling, information_loss]
        post_training_risks: [global_verbosity_shift, reduced_detail_when_needed]
        side_effect_dimensions: [token_cost, usefulness, readability, completeness]
        recommended_first_batch: false
        priority_level: later
      - axis_id: reflective-impulsively-answering
        group: cognitive_stability_style_traits
        positive_pole: reflective
        negative_pole: impulsively-answering
        definition: Clarifying assumptions and reflecting before answering versus jumping directly to an answer.
        why_it_matters: Supports ambiguity handling and instruction-following evaluation.
        prompt_families: [underspecified_request, conflicting_instruction, ambiguous_goal, planning]
        dataset_construction_rules:
          - Include cases where reflection is needed and where direct answering is better.
          - Pair assumption-aware responses with premature answers.
        automatic_eval_ideas: [clarification_rate, assumption_marker_count, judge_directness_appropriateness]
        human_annotation_rubric: Rate whether reflection was needed and whether it helped task completion.
        possible_confounds: [cautiousness, analytical_style, refusal_behavior]
        steering_risks: [over_asking_questions, delayed_answer]
        post_training_risks: [avoidance_of_direct_answers, excessive_meta_reasoning]
        side_effect_dimensions: [task_completion, user_friction, usefulness, latency]
        recommended_first_batch: false
        priority_level: medium
